catalog:
  "@nuxt/devtools": ^4.1.0
  "@nuxt/devtools-kit": ^4.1.0
  "@nuxt/eslint-config": ^1.17.0
  "@nuxt/kit": ^4.6.4
  "@nuxt/module-builder": ^1.0.4
  "@nuxt/schema": ^4.6.4
  "@nuxt/test-utils": ^4.4.0
  "@tanstack/vue-query": ^5.107.1
  "@types/node": ^25.9.9
  "@vitejs/devtools-kit": ^0.8.0
  "@unocss/nuxt": 66.12.0
  "@unocss/preset-icons": 66.12.0
  "@iconify-json/carbon": 1.2.30
  changelogen: ^0.6.2
  concurrently: ^10.0.7
  defu: ^6.1.7
  eslint: ^10.14.0
  nuxt: ^4.6.4
  pkg-types: ^2.4.0
  sirv: ^3.0.2
  splitpanes: ^4.0.4
  typescript: ~6.0.3
  vitest: ^4.1.12
